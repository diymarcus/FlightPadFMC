plugins {
    id 'com.android.application'
}

android {
    namespace 'com.virtualfmc.fbwa320'
    compileSdk 34

    defaultConfig {
        applicationId "com.virtualfmc.fbwa320"
        minSdk 19
        targetSdk 34
        versionCode 2
        versionName "0.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FBWA320.apk"
        }
    }
}

dependencies {
    // Android Support Library (for API 19 compatibility)
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:support-compat:28.0.0'

    // WebSocket client (nv-websocket-client)
    implementation 'com.neovisionaries:nv-websocket-client:2.14'

    // JSON handling: use Android's built-in org.json.* — no Maven dependency
    // (org.json:json removed — conflicts with Android platform classes)

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
